# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/tts/webserver.pid;
error_log /var/log/sdkwork/tts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name tts-test.sdkwork.com tts-test.birdcoder.com tts-test.dtupay.com tts-test.sdkwork.cn tts-test.birdcoder.cn tts-test.dtupay.cn tts-test.skubc.com tts-test.skubc.cn tts-test.zowalk.com tts-test.zowalk.cn tts-test.offer86.com tts-test.offer86.cn tts-test.86offer.com tts-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
