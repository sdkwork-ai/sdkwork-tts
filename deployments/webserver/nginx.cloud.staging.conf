# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/tts/webserver.pid;
error_log /var/log/sdkwork/tts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name tts-staging.sdkwork.com tts-staging.birdcoder.com tts-staging.dtupay.com tts-staging.noaper.com tts-staging.sdkwork.cn tts-staging.birdcoder.cn tts-staging.dtupay.cn tts-staging.noaper.cn tts-staging.skubc.com tts-staging.skubc.cn tts-staging.zowalk.com tts-staging.zowalk.cn tts-staging.offer86.com tts-staging.offer86.cn tts-staging.86offer.com tts-staging.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/tts/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
