# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/tts/webserver.pid;
error_log /var/log/sdkwork/tts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name tts-demo.sdkwork.com tts-demo.birdcoder.com tts-demo.dtupay.com tts-demo.noaper.com tts-demo.sdkwork.cn tts-demo.birdcoder.cn tts-demo.dtupay.cn tts-demo.noaper.cn tts-demo.skubc.com tts-demo.skubc.cn tts-demo.zowalk.com tts-demo.zowalk.cn tts-demo.offer86.com tts-demo.offer86.cn tts-demo.86offer.com tts-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/tts/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
