# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/tts/webserver.pid;
error_log /var/log/sdkwork/tts/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name tts-dev.sdkwork.com tts-dev.birdcoder.com tts-dev.dtupay.com tts-dev.sdkwork.cn tts-dev.birdcoder.cn tts-dev.dtupay.cn tts-dev.skubc.com tts-dev.skubc.cn tts-dev.zowalk.com tts-dev.zowalk.cn tts-dev.offer86.com tts-dev.offer86.cn tts-dev.86offer.com tts-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
